[pytest]
testpaths = tests
# The packages live under src/; this makes them importable for the tests
# whether or not the project has been installed.
pythonpath = src
# Test files in different folders may share a file name. Tests marked gpu
# load a real model, tests marked live talk to the real platform and tests
# marked pokemon_sim run the local Pokémon Showdown on Node; all three are
# left out unless asked for by marker.
addopts = --import-mode=importlib -m "not gpu and not live and not pokemon_sim"
markers =
    gpu: starts the real llama-server with a real model file on the GPU (run with: pytest -m gpu <test file>)
    live: talks to the real AltruAgent platform with the key from .env (run with: pytest -m live tests/live)
    pokemon_sim: runs battles on the local Pokémon Showdown, after `npm ci` in tools/pokemon_sim (run with: pytest -m pokemon_sim tests/practice/test_pokemon_sim.py)
# docs/ and tmp/ can hold downloaded third-party projects with tests of their
# own, and runs/ holds match records; none of them is ever collected.
norecursedirs = .* *.egg-info build dist docs runs tmp venv
