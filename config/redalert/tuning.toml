stepped_advance = true
stepped_return = true
step_cells = 10
step_min_move_cells = 15
step_arrive_cells = 4
step_arrive_share = 0.8
step_long_range_extra_cells = 3
step_straggler_seconds = 12
step_max_seconds = 40
step_snap_cells = 3
