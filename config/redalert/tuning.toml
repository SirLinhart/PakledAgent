expansion_cover_rally = true
expansion_cover_forward_cells = 6
expansion_cover_reach_cells = 18
# With reinforce_hold_home on, while the centroid of main's army (its units gone forward, or main's units while the
# model commander commands it) is more than reinforce_away_cells from the home gather point (the forward hold's gather
# point while it publishes one, else the staging point), the units joining main (the plan's reinforcements, forward
