[siege]
# How main's artillery (arty) and V2 (v2rl), its siege subgroup, fight: "screened" fires them from their firing band
# behind a screen of main's other units; "frontal" sends them in with the rest of main. No other value is accepted.
mode = "screened"
# A long-range unit's firing band against a target runs out to its weapon range less band_inner_margin, and in from
# its minimum range plus band_min_range_margin, or from the range plus band_defense_margin of every known enemy
# defense that could reach it in the band, raised by that defense's distance from the target; whichever is farther.
# A unit does not engage a target whose band is empty.
band_inner_margin = 0.5
band_min_range_margin = 1
band_defense_margin = 0.5
# While main advances or fights, its screen holds a line this many cells ahead of the siege subgroup's centroid,
# toward its objective: screen_gap_arty for artillery, screen_gap_v2rl for V2s, the larger for both ...
screen_gap_arty = 2
screen_gap_v2rl = 5
# ... and at least screen_defense_margin outside the range of every known enemy defense.
screen_defense_margin = 1
# A known enemy defense is worth this focus weight to a long-range unit.
defense_priority_weight = 1.5
# A long-range unit with an enemy unit within its minimum range plus fallback_margin moves fallback_step cells toward
# the base: an arty once while the enemy stays that close, a V2 again and again while all of them are infantry.
fallback_margin = 2
fallback_step = 4
# A long-range unit is ordered to move again only to a cell at least reissue_cells from the one it was last sent to,
# and is given at most one order in reissue_ticks.
reissue_cells = 2
reissue_ticks = 25
# The siege subgroup goes forward from the staging point only with a screen worth at least screen_ratio_allies
# (Allies) or screen_ratio_soviet (Soviets) times what it is worth itself; under FINISH main goes forward whatever its
# screen is worth.
screen_ratio_allies = 1.0
