step_plan_continuity = true
step_replan_seconds = 5
step_large_group_units = 15
step_large_arrive_extra_cells = 2
met_enemy_decision = true
met_cells = 10
met_fight_ratio = 1.0
met_abandon_ratio = 0.7
met_decision_seconds = 6
met_chase_cells = 5
