slot_spacing_cells = 2
slot_resend_cells = 3
slot_idle_ticks = 50
# With artillery_screen_place on, main's artillery and V2 out of contact (no enemy unit in sight and no known ground
# defense within their weapon range and 2 cells), with a screen unit within 10 cells of their centroid, stand on a
# line across the threat direction artillery_offset_cells behind the screen's centroid (the current step point while
# main moves by steps), on the far side from the threat, slot_spacing_cells apart, each place on open ground out of
# every known ground defense's range: while main moves by steps or waits at a step point, holds or gathers, or fights.
# The threat is the centroid of the visible enemy ground combat units and known ground defenses within
# artillery_threat_cells of a unit of main, else on a stepped advance its destination and on a move home or a step
# back the cell it came from, else the enemy start. A unit is sent again once its place moved slot_resend_cells or the
# threat turned artillery_turn_degrees, at most once a second. A kite fall-back moves fallback_step cells straight
# away from the nearest enemy, to a cell no nearer to any other visible enemy, else toward its place. Not measured;
# it ships on.
artillery_screen_place = true
artillery_offset_cells = 3
artillery_threat_cells = 15
artillery_turn_degrees = 45

[raids]
# With enabled = false the agent does not raid: RAID is never open, no unit is trained for the raid quota, and the
# raid group goes back to main.
enabled = true
# With standing = true the raid group is formed, filled first by production and sent out under every plan after the
# opening but PRESERVE (HOLD, RAID, PRESS, STRIKE and FINISH), alongside main; under PRESERVE it is called back to the
# staging point and waits there. With false it raids under RAID and PRESS only. Off: with the tank rows of the mix,
# the light-tank raid and no Soviet raid it won 309 of 720 games against 444 for the shipped values, at a mean kd of
# -2,201 against 6,703, and England won fewer games the larger the raid group (docs/BENCHMARKS.md). The raids killed
# little, so the units held out of the main army cost more than the raids returned.
standing = false
# With launchable_only = true RAID is open only while a raid could set out now: a raid target is known, a way that
# crosses no covered cell leads from the staging point to one, and the raid group's units with the fit main units
# within borrow_home_cells of the base's center or the staging point (none gone forward, none in a fight, never the
# home guard) fill the quota. When RAID is chosen those main units go into the raid group at once. When no raid has
# set out launch_within_ticks after RAID was chosen, the raid group goes back to main and RAID stays closed for
# resend_after_ticks. With false RAID opens on a raid target alone. Not measured; added in iteration 14, it ships on, as
# in the watched game 20261012T091508Z (see the head of the file).
launchable_only = true
borrow_home_cells = 15
launch_within_ticks = 1500
# The raid group is ready once it holds its full quota within gathered_cells of the staging point.
gathered_cells = 6
# Only a unit at fit_hp or more is taken into the raid group.
fit_hp = 60
# A raid attacks from the cell approach_cells short of its target on the line from the staging point, and goes
# round by a waypoint side_offset_cells to the side of that line when the line crosses a covered cell.
approach_cells = 8
side_offset_cells = 12
# A raid has reached a cell on its way once its centroid is within reached_cells of it, or once all its units
# have stood idle when it has been on its way there for leg_patience_ticks.
reached_cells = 3
leg_patience_ticks = 50
# A raid goes after enemy harvesters. It goes after a refinery only when no enemy harvester has been seen for
# refinery_after_ticks and the group's damage over refinery_kill_seconds reaches the refinery's hit points left.
refinery_after_ticks = 1500
refinery_kill_seconds = 20
# A raid breaks off when its estimate is below raid_break_off_ratio, when its units' mean hp is below break_off_hp,
# when a unit stands in a covered cell, when it has lost lost_share of the units it set out with, or when its target
# has been out of sight at its last known cell for target_unseen_ticks.
raid_break_off_ratio = 0.7
break_off_hp = 50
lost_share = 0.5
target_unseen_ticks = 250
# A raid that broke off is not sent out again for this long; its units below fit_hp leave it.
resend_after_ticks = 500
# The APCs of an APC raid unload unload_cells short of their target and stay within as many cells of the rockets.
# When the rockets are to board again, the APCs leave once all are aboard or after reload_wait_ticks, whichever is
# first.
unload_cells = 3
reload_wait_ticks = 75
# With prefer_exposed_trucks on, a raid goes after the harvesters of the raid opportunities scouting records
# (exposed_trucks of [scouting]) before any other harvester, the nearest of them first; off, the raid's targets are
# ranked as above. Not measured; it ships off.
prefer_exposed_trucks = false
# With raid_exposed_trucks on, a raid opportunity scouting records (exposed_trucks of [scouting]) whose guard is worth
# at most exposed_raid_guard_max and whose harvesters were seen within exposed_raid_seen_seconds launches the raid at
# the harvester nearest our base, the freshest opportunity first, whenever no raid is out and the units on hand fill
# the raid quota: under RAID and PRESS, and under HOLD and FINISH, which keep the raid group, too. Off, raids are as
# above. Not measured; it ships on.
raid_exposed_trucks = true
exposed_raid_guard_max = 200
exposed_raid_seen_seconds = 20

[anti_air]
# The rocket squads of the army mix answer a few aircraft; extra anti-air waits until more than a few are seen, as the
# user directed: while at least aa_min_aircraft (1 or more) enemy combat aircraft (an aircraft with a weapon: heli,
# mh60, yak, mig) have been seen in the last aa_window_seconds, each counted once by its id, those shot down included.
# A helipad or airfield seen calls for nothing extra. With none seen for aa_window_seconds the extra answer stops.
# With enabled = false nothing is seen, and none of what follows is done.
enabled = true
aa_min_aircraft = 3
aa_window_seconds = 180
# While the extra answer is in force, after the counter shift of [mix] and within its bounds, the army mix adds a
# rocket squad for every aa_aircraft_per_squad (1 or more) aircraft beyond aa_free_aircraft, up to aa_squads_max:
# aa_squad_points more points to the rockets (e3) for each, the row then scaled back to 100, so that 8 points add 4 to
# 5 rockets to the 8 of 12 tanks. For the Soviets it moves air_flak_points from the main tank (3tnk) to the flak
# truck (ftrk) as well; with 0 the rockets alone answer aircraft: a Soviet switch, on (see the head of the file).
aa_free_aircraft = 2
aa_aircraft_per_squad = 2
aa_squads_max = 3
aa_squad_points = 8
air_flak_points = 0
# While the extra answer is in force and a radar stands, the base keeps aa_defenses AA defenses (agun, sam) standing or
# on their way, and aa_defenses_many from aa_many_aircraft aircraft seen in the window. One is ordered at a time, when
# the Defense queue is free, the base is quiet, no lost core building is saved for, the power target allows and the
# money above production_cash_reserve of [upkeep], with invest_income_share of [income] of what comes in while it is
# built, pays for it; a lost one is replaced the same way while they are wanted.
aa_defenses = 1
aa_defenses_many = 2
aa_many_aircraft = 6
# An AA defense is placed on the free cell nearest the own refinery nearest the enemy's start, within this many cells
# of it; with no such cell free it is placed as any other defense.
aa_refinery_cells = 6
# With remote_base_aa on, an enemy combat aircraft in sight within 8 cells of a remote base (a base cluster without the
# main yard whose center is remote_base_cells or more from it, or with a yard of its own) while that base loses hp gets
# one AA defense ordered and placed within 4 cells of that base's buildings, the radar first with none standing and 5
# rockets (e3) sent there meanwhile, whatever the count above, the reserve, a quiet base or a hold on the economy; none
# while an AA defense stands within 6 cells of the building hit, at most one at a base, and none once the aircraft is
# destroyed before it is placed with no other seen near the base for 30 s.
remote_base_aa = true
remote_base_cells = 15

[plan_rules]
# The strength main must be worth before it goes forward, by plan: 99999 is more than any army is worth, so main
# never goes forward under OPENING, HOLD, RAID and PRESERVE.
opening_attack_strength = 99999
hold_attack_strength = 99999
raid_attack_strength = 99999
press_attack_strength = 3000
strike_attack_strength = 1200
finish_attack_strength = 1200
preserve_attack_strength = 99999
# R2 and R3: with this many seconds or fewer left, a positive trade balance is preserved (PRESERVE) and a zero
# balance is played under HOLD.
clock_seconds = 180
# R4: with this many seconds or fewer left and a negative trade balance, the agent presses (PRESS).
press_late_seconds = 120
# With late_press_guard on, R4 does not open while base defense reports a major threat on the base, and a PRESS R4
# set ends as soon as one is reported; the plan is then what the other rules give. Off, R4 does not look at threats.
# The guard is on, with press_late_seconds at 120 (300 with the guard off): a Soviet switch that acts for the Allies
# as well (see the head of the file).
late_press_guard = true
# Once R2, R3 or R4 has set the plan, it stays until the trade balance has been more than clock_balance_margin on
# the other side of zero (for R3, on either side) for clock_switch_ticks in a row.
clock_balance_margin = 500
clock_switch_ticks = 250
# With finish_over_preserve on, R6 is checked before R2 and R3 in the last clock_seconds: the plan is FINISH whenever
# R6 applies (finish_rest_ticks included), and a FINISH in force stays until R6 has not applied for clock_switch_ticks
# in a row; PRESERVE or HOLD only when it does not. R4 and the late-PRESS guard are as above. Off, R2 and R3 come first.
finish_over_preserve = true
# R5: STRIKE starts only up to this game second, with the enemy base seen and no enemy defense remembered, while
# the enemy's combat value is at most strike_max_enemy_value and main is worth at least strike_min_strength ...
strike_until_seconds = 240
strike_max_enemy_value = 500
strike_min_strength = 1200
# ... and is given up for the rest of the match once a defense is remembered or main's ratio falls below this.
strike_abandon_ratio = 0.9
# R6(a): FINISH from this game second, with the enemy base seen and no negative balance, when the own army is worth
# at least finish_min_army and finish_army_ratio times the enemy's combat value plus finish_defense_weight times
# the cost of its remembered defenses.
finish_from_seconds = 480
finish_min_army = 3000
finish_army_ratio = 1.3
finish_defense_weight = 2.0
# R6(a) also needs tanks and long-range units (1tnk, 2tnk, 3tnk, 4tnk, arty, v2rl, ttnk) to make up at least this
# share of main's value, each unit at its cost times its share of health; with main worth nothing this does not apply.
finish_heavy_share = 0.3
# R6(b): FINISH from cleanup_from_seconds on, when enemy buildings are remembered, no enemy combat unit or defense
# is, no enemy combat unit has been in sight for cleanup_unseen_ticks, and main is worth cleanup_min_strength or more.
# 8000: on seed 1001 a cleanup FINISH started on stale intel at 6:00 with main at 6,500 failed and the game was lost.
cleanup_from_seconds = 360
cleanup_min_strength = 8000
cleanup_unseen_ticks = 1500
# R7: PRESS is open from this game second with an army worth at least press_min_army and press_army_ratio times
# the enemy's combat value.
press_from_seconds = 360
press_min_army = 3000
press_army_ratio = 1.5
# With blind_press_guard on, an enemy army counts as known while one of its units that fights (not a harvester, MCV,
# aircraft or defense) was seen less than enemy_army_fresh_ticks ago. While it is unknown, the rule above and the
# ratio below weigh an enemy army worth assumed_enemy_share times the own, so that, with a share of at least 1 /
# press_army_ratio, PRESS does not open against an enemy army nobody has seen. While it is known, they weigh the
# larger of its remembered combat value and the largest it had within the last enemy_army_fresh_ticks. STRIKE and
# FINISH weigh what is remembered. With blind_press_guard off, the enemy's remembered value is weighed throughout
# (ratio_without_enemy of [combat] while it is 0), and PRESS also opens, whatever the army, from
# press_unseen_base_seconds on while the enemy base has not been seen and no scout is out.
enemy_army_fresh_ticks = 3000
assumed_enemy_share = 1.0
blind_press_guard = true
press_unseen_base_seconds = 300
# A big army facing an enemy army nobody sees: while main is worth at least big_army_value, no enemy unit that fights
# on the ground (as above) has been in sight for unknown_army_seconds and the enemy base has been seen, an enemy army
# that is not known is weighed at main's worth over big_army_assumed_ratio instead of assumed_enemy_share times the own,
# and the table below presses whenever PRESS is open on that. Every other condition of PRESS holds: the base must be
# known, the clock rules come first (a late lead is kept), a major threat holds, and main keeps out of a fight under
# enemy defenses. With scout_missions of [scouting] on, the scouts are then sent to the attack lane and the enemy
# main's edge before any other mission, at most once a minute. A ratio of 0 weighs nothing from main.
big_army_value = 15000
unknown_army_seconds = 120
big_army_assumed_ratio = 1.5
# With early_attack_guard on, R5 never starts STRIKE, whatever strike_until_seconds allows, and before the game second
# early_press_until_seconds R7 opens PRESS only once the enemy has committed its army: a major threat on the base has
# ended with no fewer own core buildings (refinery, power plant, barracks, war factory, construction yard) standing
# than when it began, or the value the agent has killed (kills_cost) has reached early_press_kill_value. A PRESS in
# force is not ended by this, and R4 is left as it is. Every comparison of the own army with the enemy's (the ratio of
# the table below, the PRESS rule above and R6(a)) then counts the own combat units only, each at its cost, without
# the harvesters, the MCV and the other units that do not fight. Each block of STRIKE or of an early PRESS is written to
# the match record as one plan_rule_blocked event with the reason early_attack_guard. Off, none of this applies. The
# guard is on: against the Normal bot, Russia and England together on 432 fresh seeds for each arm, it won 263 games
# against 222 with it off, at a mean kd of 5,305 against 1,007 (docs/BENCHMARKS.md).
early_attack_guard = true
early_press_until_seconds = 540
early_press_kill_value = 1500
# R7, the script's choice among the open plans, on the ratio of the own army's value to the enemy's combat value
# (ratio_without_enemy of [combat] while the one weighed is 0), the first that applies: HOLD under a major threat or at
# a ratio below default_weaker_ratio; PRESS when it is open and the ratio is at least default_press_ratio (or, with
# blind_press_guard off, the enemy base has not been seen); RAID when it is open; else HOLD.
default_weaker_ratio = 1.0
default_press_ratio = 2.0
# A plan a decision source chose is not changed by its next answer within answer_hold_ticks.
answer_hold_ticks = 250
# A plan R5, R6 or R7 changed to is kept at least plan_hold_ticks, unless R1 to R4 apply, the enemy base is gone or
# a STRIKE is given up; FINISH is not taken up again within finish_rest_ticks of leaving it.
plan_hold_ticks = 750
finish_rest_ticks = 750
# With finish_commit on, a FINISH R6 opened stays at least finish_commit_seconds whatever R6 and R7 say, unless
# main's strength falls under finish_commit_value_share of what it was when FINISH opened or base defense calls main
# home; R1 to R4 and the enemy base gone end it as ever. Not measured: in the live game of 20261016 (shadowfiend-ii,
# rush) FINISH opened twice at a balance of +8,750 and +13,500 and was left by R7 each time its 30-second hold ran out;
# it ships on.
finish_commit = true
finish_commit_seconds = 90
finish_commit_value_share = 0.8
# With model plan choice on, the red_alert_plan chain is asked at most once in this many ticks, and given this many
# milliseconds to answer.
choice_every_ticks = 125
choice_deadline_ms = 1500
# With model_plan_hold on, a plan a decision source's answer changed to is held for model_plan_hold_ticks: no later
# answer replaces it, the chain is not asked meanwhile, and R7 keeps it even when it is no longer open. R1 to R4 end
# the hold whenever they apply, R5 and R6 once plan_hold_ticks is over, and so do a major threat on the base and, for
# a held RAID, the closed reasons "no raid target known" and "raid did not set out"; each such end is one
# plan_rule_blocked event with the reason model_hold_ended and its cause. Under a major threat the chain is not asked
# and no answer is taken: one that arrives is a plan_rule_blocked event with the reason model_answer_discarded. Off,
# answer_hold_ticks and plan_hold_ticks hold a chosen plan as above. Not measured; added in iteration 16, it ships on,
# as in the watched game 20261012T091508Z (see the head of the file). It changes nothing while model_plan_choice of
# [redalert] in config/agent.toml is off, as it ships.
model_plan_hold = true
model_plan_hold_ticks = 750
# With enemy_army_estimate on, the plan rules estimate the enemy army E once a cycle, in credits (see enemy_estimate):
# the cost of the remembered enemy units that fight on the ground and are not stale (V), or, when more, the last
# estimate grown by the enemy's income on the army and less the cost of what we killed since. The enemy's income is its
# harvesters, the more of the enemy harvesters and refineries remembered (our own harvesters while none was seen), times
# our own income a harvester, or estimate_income_per_harvester credits a second while ours gives no rate;
# estimate_army_spend_share of it goes to the army. It grows only up to estimate_growth_max_seconds after an enemy army
# unit was last in sight, and never drops below V or 0. It is unknown until an enemy army unit has been seen. One
# enemy_estimate event at most every 30 s gives it. The spending focus of the upkeep table reads it. Not measured; it
# ships on.
enemy_army_estimate = true
estimate_income_per_harvester = 8.0
estimate_army_spend_share = 0.5
estimate_growth_max_seconds = 240

[clock]
# Under PRESERVE every group farther than this from base_center is called back to the staging point.
preserve_recall_cells = 15
# With this many seconds or fewer left (under R3, from the start of R3), and money of at least spend_floor_cash,
# the production reserve is waived and every empty Defense, Vehicle and Infantry queue is given the dearest
# defense or fighting unit the money pays for, until less than spend_floor_cash is left.
spend_remaining_seconds = 120
spend_floor_cash = 300
# Under PRESERVE one defense is built every preserve_defense_seconds while the money is at least
# preserve_defense_min_cash: the defense against infantry (ftur, pbox), or, with preserve_anti_armor of [upkeep] on,
# the defense against armor (tsla, gun) when vehicles make up at least vehicle_heavy_share of [mix] of the enemy army
# seen, held to the power target of [upkeep] with a power plant first when it would leave less over.
preserve_defense_seconds = 60
preserve_defense_min_cash = 600
# With endgame_defenses off, the spending of the last minutes leaves the Defense queue out, and the money goes to the
# unit queues, unless a ground enemy hit an own building within the last 60 seconds.
endgame_defenses = false
# With endgame_lead_defenses on, in the last endgame_lead_seconds, with the trade balance at endgame_lead_margin or
# more, our combat army (main, guard, escort at cost) and the enemy army estimate both worth endgame_heavy_army_value
# or more, and no FINISH (R6) applying, the plan is PRESERVE by rule R2E until the balance has stood at 0 or below for
# clock_switch_ticks of [plan_rules] or R6 applies. Meanwhile the Defense queue, whenever free and paid for, builds the
# Tesla coil (Soviets, a power plant first when power runs short) or the turret (Allies), up to
# endgame_lead_defenses_max, at the placeable cell nearest the cell endgame_defense_forward_cells from base_center
# toward the enemy's start, within endgame_defense_cluster_cells of it; the unit queues get only the money above the
# next defense's price. Main gathers at that cell and engages only enemies within endgame_army_leash_cells of it.
# The time-limit tiebreak is the trade balance first: a lead kept behind defenses wins. Not measured; it ships on.
endgame_lead_defenses = true
endgame_lead_seconds = 300
endgame_lead_margin = 1000
endgame_heavy_army_value = 5000
endgame_lead_defenses_max = 15
endgame_defense_forward_cells = 10
endgame_defense_cluster_cells = 7
endgame_army_leash_cells = 8

[terrain]
# A cell of the map picture a building can stand on shows one of these characters: clear ground, road and a spawn,
# the only ground the engine places a building on. Every other cell is blocked, rough ground (,) among them, and the
# ore ($ * M) even when it is listed here. At least one character.
buildable_characters = ".=S"
# One handled error is logged at the start of a match when the characters that are neither listed above nor known to
# be blocked (water ~, rock ^, trees T, rough ground , and the ore) cover more than this share of the picture's cells.
unknown_block_warn_share = 0.2

[world]
# A unit that boards a transport leaves the state's units and is reported lost although it is alive. A unit gone from
# the units is taken as boarded on a transport when the agent's latest enter_transport order for it was sent at most
# board_window_ticks before, the transport still stands and holds fewer than transport_capacity units. A unit still
# walking to its transport board_window_ticks after that order is ordered in again, and units unloaded from a
# transport that have not reappeared board_window_ticks after the unload are no longer counted aboard.
board_window_ticks = 100
transport_capacity = 5

[commander]
# With model_commander of [redalert] in config/agent.toml on, the red_alert_commander chain is asked every batch to
# pick one of the script's checked actions for the first scout, then, once main's own units reach
# handover_combat_units, for main for the rest of the match. An answer older than answer_max_age_ticks, or naming an
# action no longer offered, is dropped; the order of a standing action is sent again once it is that old. The prompt
# shows the last history_size picks and at most options_max actions, each kind of action under a letter of its own.
# Not measured; the switch ships off.
handover_combat_units = 6
answer_max_age_ticks = 25
history_size = 4
options_max = 6
# main gathers at the staging point until its forward gate opens: its value at least go_min_value and go_enemy_share
# of the enemy estimate (unless that is assumed), and go_body_share of its units within gathered_cells of [raids] of
# its centroid. The gate closes once main's value falls below regroup_value_share of its value when it opened. While
# it is closed main is offered no forward action but an attack on a group within near_attack_cells.
go_min_value = 4000
go_enemy_share = 0.8
go_body_share = 0.75
regroup_value_share = 0.5
near_attack_cells = 10
# A picked action is kept this long unless its units arrived, the threat changed, the scout must flee, it is no
# longer offered or the gate opened or closed.
commit_seconds = 8
# The script moves main to the staging point once its fight stays under retreat_ratio for retreat_confirm_ticks,
# until it reads no enemy (no enemy unit within 15 cells and no ground defense reaching main), it is at least
# resume_ratio, or main is within 6 cells of the staging point. These are this table's own, not retreat_ratio of
# [combat]. A strike near us does not read them: it is abandoned on strike_abandon_ratio of [plan_rules].
retreat_ratio = 0.9
retreat_confirm_ticks = 25
resume_ratio = 1.2
# While main, its units' cost times their health, is worth less than attack_min_army_share of the enemy estimate of
# its question (enemy_total_est) once the enemy army has been seen (an assumed estimate never holds main back), main
# is offered no attack, advance, siege, flank, raid trucks or task on a target more than 15 cells from the base's
# center. Gather is always offered.
attack_min_army_share = 0.5
# main's question lists at most targets_max targets within target_reach_cells of its body's center, the nearest first,
# each with our win chance: the enemy groups, whose units are joined by single link at target_group_cells, and the
# ground defenses.
target_reach_cells = 20
target_group_cells = 4
targets_max = 4
# A picked task (run over, kill defense, hit group) or raid trucks sends a detachment out of main, at most
# detachments_max at once. A task fails once its own chance stays under task_fail_chance percent for task_fail_ticks,
# or half its units are lost; a kill defense ends after kill_defense_seconds and a hit group after hit_group_seconds.
detachments_max = 2
task_fail_chance = 20
task_fail_ticks = 50
kill_defense_seconds = 45
hit_group_seconds = 30
# A kill defense is offered only on a defense seen less than kill_defense_seen_seconds ago, with an artillery piece or
# V2 of main whose firing band against it is not empty and no detachment on it; one fails once every one of its units'
# bands is empty, or its target has gone unseen kill_defense_seen_seconds, for task_fail_ticks.
kill_defense_seen_seconds = 20
# Retreat home is offered only while main's centroid is more than retreat_home_min_cells from the base's center; from
# nearer, main is home already and the other defensive actions (pull back, hold) are offered without it. It lies
# beyond the staging point, staging_distance_cells (10) of [upkeep] out, so that retreat home is not offered at or
# near it: in the watched game retreat home was picked there, about 10 cells from the base's center, 12 times in 24 s.
retreat_home_min_cells = 14
# main's question reads a military state: the enemy's buildings, ours and the enemy's combat units each in clusters by
# single link at cluster_cells (a sprawled base or a stretched army is one cluster, two far apart are two), labelled
# E1, B1 and F1 and keeping their number while their center moves less than that between questions. An enemy force's
# or base's infantry that a crush run would qualify on counts at crush_discount of its strength in the crush-adjusted
# ratio while main has as many fit tanks as the run takes (crush_per_tanks of [combat]), else in full.
cluster_cells = 8
crush_discount = 0.333
# A cluster of buildings without a construction yard whose center lies within base_merge_cells of the center of a
# cluster with a yard of the same side is part of the nearest such base and keeps that base's label; one farther off
# stays an outpost, and an expansion with its own yard always stays apart. In the watched game refineries 8.5 cells
# from our yard showed as outposts of their own at cluster_cells 8.
base_merge_cells = 16
# While the forward gate is open, main is not offered to gather while main as a whole (its units and those joining it
# within 30 cells of its centroid or sent on to it) is worth regroup_block_ratio of a seen enemy estimate or more,
# main lost no fight in the last 30 s and no major threat is on the base: in the watched game a gather picked while
# main was winning pulled it 28 cells home. A gather offered while main is still worth the enemy estimate or more
# goes to main's own centroid, not to the staging point.
regroup_block_ratio = 1.5
# With step_commit on (and stepped_advance of [combat] on), while main is on a stepped move an answer naming the
# standing action, or an action whose cell lies within step_cells of [combat] of the move's destination, keeps the step
# plan; an answer naming another is held (a fallback event of reason step_commit) and the newest held one is taken in
# the cycle the step releases, or dropped as not_offered, but at once when main's threat or forward gate changed since
# its action was taken, for a raid trucks or task pick, and while base defense calls main home. A hold so waits for the
# release, and main stands at the step point. The retreat override taking main on a stepped advance steps it back one
# step (to the current step's start) instead of to the staging point, without closing the forward gate, and the
# standing action steps on once the override lets go; the override_retreat event says step_back and the cell. Not
# measured; it ships on.
step_commit = true
# With continue_option on, a standing action of main (an advance, flank or siege) or of the scout (a mission) that the
# fresh list leaves off is offered again as the continue option, letter Z, its line headed "continue: " and marked
# (current): the cycle's candidate the options_max cut dropped, else the action as taken; only while its units have not
# arrived within 3 cells of it, its target is remembered (the siege's defense with a long-range unit left, the advance's
# or flank's cell the enemy's start or a remembered enemy's; the scout's mission still offered), main is not attacked at
# home nor losing where it stands, the gate is open with no retreat override or regroup due and, while main is behind,
# its cell near home; the scout with no danger flight and a safe way. A full list gives way: main's lowest-ranked
# active action (economy, expansion, then the cut's order from its end), the scout's lowest-scored mission; never a
# defensive action, gather, hold or back off. An answer naming Z keeps the standing action as it is. The summary event
# counts continue_offered and continue_picked. Not measured; it ships on.
continue_option = true
# With override_counts_detachments on, while a task or raid trucks detachment is out the retreat override weighs main's
# fight where it stands (fight_here) with the detachment's units added to main's body, against the same enemies. Off,
# the units left at the body were weighed alone: in the tournament game of 20261016 a hit detachment took 8 of main's
# 10 units, the 2 left weighed under retreat_ratio, the override took main and ended the detachment, and it let go
# again once the 10 stood together, so that main split and waffled. Not measured; it ships on.
override_counts_detachments = true
# With gate_counts_away on, main's forward gate weighs main as a whole with its units away on a job of their own (a
# commander's detachment, a strike force, the helpers sent to a fight going our way), when it opens and while it stays
# open. Off, a detachment going out read as main's value lost: in the live game of 20261016 (shadowfiend-ii, rush,
# 10:53) a hit detachment of 4 tanks took main's measured value from over 4,000 to 921, the gate closed for a regroup
# and main was sent home 43 cells from an unguarded enemy yard. Not measured; it ships on.
gate_counts_away = true
# With gate_capped_estimate on, main's forward gate opens, stays open and closes for a regroup against the enemy
# estimate held to recovery_estimate_seen_share of [upkeep] times the cost of the enemy combat units seen within
# recovery_seen_seconds, as the military recovery holds it. Not measured: in the live game watch41-m8-rush-1007 the gate
# closed for a regroup at 21394 against a peak of 6,850 and never reopened; it ships on.
gate_capped_estimate = true
# With script_fallback on, once no answer of a model has been used for script_fallback_seconds (a question of one option
# answered by the chain is no model's answer), the commander picks by script in every cycle until a model's answer is
# used again: main takes the first offered of retreat home, gather, hold under a major threat; of the attack on an
# enemy expansion, the advance, the attack, the siege, the flank, the attack on the economy, gather under PRESS, STRIKE
# and FINISH; of gather, hold otherwise; the scout is left to its own missions. commander events of kind
# script_fallback (start, end), and an action event with source script for each pick. Not measured: in the live game
# of 20261016 (sidestep, rush) the model answered nothing from 7:28 to 20:00 and main stood on its last pick, gather,
# with the gate open under FINISH; it ships on.
script_fallback = true
script_fallback_seconds = 8
# With scout_commit on, a scout pick with a destination is kept scout_commit_seconds rather than commit_seconds, on the
# same terms (until the scout arrives, must flee, or the mission is no longer offered); an answer naming a back off is
# never held against it, and one held only by the longer time is a fallback event of reason scout_commit. Not
# measured: in the live game of 20261016 (watch41-m5-rush-1010, 2:15) the model turned the first scout five ways in 22
# seconds; it ships on.
scout_commit = true
scout_commit_seconds = 20

[routing]
# With waypoints on, the agent keeps a graph of waypoints for the match: the center of every ore field, the base's
# center, the four cells scout_view_cells of [scouting] north, east, south and west of the enemy's start, the corners
# and middles of the map's sides 4 cells inside it, and the ends of the walked routes. Two of them within
# edge_max_cells of each other are joined when the straight line between them crosses no blocked ground and no cell
# within edge_clear_margin_cells of the ground a remembered enemy defense covers; a walked route joins its ends. The
# graph is built at the start of the match and again whenever the remembered defenses or the walked routes change. A
# raid whose straight way is covered, a scout whose straight way crosses danger, the commander's flank and the second
# yard's MCV (with mcv_safe_site of [expansion]) go by the shortest chain of waypoints, and as they did without the
# switch when there is none; each way taken is a route event. Not measured; the switch ships off.
waypoints = false
edge_max_cells = 30
edge_clear_margin_cells = 2
