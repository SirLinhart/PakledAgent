# With march_when_clear on, while main advances under PRESS, STRIKE or FINISH and is clear of the enemy, the screen
# attack-moves on the objective, sent again when it stands idle away from it or the objective changes, and the
# long-range units follow, held back by the screen line alone. The advance becomes clear once no enemy unit that counts
# in a fight and no remembered defense that fires at ground units (not agun or sam) is within march_clear_cells of any
# of its units, and stops being clear once one comes within march_blocked_cells. A clear advance whose centroid gains
# less than march_progress_cells toward the objective in march_progress_seconds goes frontal, all of main attack-moving
# on the objective, until it is no longer clear or the plan changes; each such switch is a siege event with the reason
# stall_frontal. That watch starts over when main fights, goes back to the staging point, or its plan or objective
# changes, not when an enemy comes and goes. Not measured; added in iteration 19, it ships on, as in the watched game
# 20261012T091508Z (see the head of the file).
march_when_clear = true
march_progress_cells = 5
march_progress_seconds = 15
march_clear_cells = 15
march_blocked_cells = 12
# A long-range unit with no enemy unit in sight and no known defense within its weapon range and 2 cells moves to a
# slot of its own, slot_spacing_cells from the next on a line across the approach toward the objective: on a march the
# middle of its band with no defense near (8.25 cells for arty, 7.25 for v2rl) behind the screen's front, while the
# screen holds its line as deep as the line lets it go. It is sent there again once the slot has moved
