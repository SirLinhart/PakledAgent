# Red Alert item facts the agent falls back on when a match gives no rules of
# its own. The platform's game reference (get_game_config("red_alert").rules)
# is the authority: every value it gives replaces the value here, so this file
# only decides what the agent believes when that reference is missing or
# leaves a value out.
#
# The layout follows the platform's rules object: one table per building under
# [buildings] and one per unit under [units].
#
#   cost           credits
#   power          positive provides, negative drains
#   queue          the production queue that makes the item; an item without
#                  one cannot be produced (the construction yard)
#   prerequisites  buildings that must stand, besides the building that
#                  produces the item's queue
#   factions       the factions that can produce it; left out when all can
#   hp             hit points, as the engine counts them. Observations report
#                  hp as a percentage, so these only weigh items against each
#                  other
#   speed          cells per second on clear ground
#   range          weapon range in cells
#   roles          what the item is for, in the agent's own words
#   build_time_s   seconds to build at full power; left out when it is the
#                  usual 0.024 s per credit
#
# Values come from the rule files of the OpenRA development branch
# (mods/ra/rules, mods/ra/weapons): speed is the engine's Speed x 25 / 1024.
# Lines marked "estimate" were not taken from a rule file. All of them are to
# be corrected from a captured platform rules file (scripts/capture_rules.py,
# scripts/diff_rules.py).

