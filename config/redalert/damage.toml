# How hard each Red Alert item hits each armour class and aircraft, how far, the armour it wears and whether it
# flies: what the agent hands its units' fire out by. One table per item, under the item's name, for every item of
# the matchup reference and every aircraft an enemy can field.
#
#   armour     the armour class the item wears: none, light, heavy, wood or concrete
#   range      weapon range in cells; a match's game reference replaces it where its rules give weapon.range
#   min_range  the distance in cells inside which the item cannot fire
#   dps        hit points a second against each armour class, in the engine's hit points (the scale of hp in
#              items.toml), over every ground weapon the item has
#   air        true for an aircraft, which only an anti-air weapon can hit; left out for everything else
#   dps_air    hit points a second the item's anti-air weapon does to a light aircraft
#   air_range  the range of that anti-air weapon in cells
#
# Only the items that fight have range, min_range and dps; an item without them does no damage on the ground. Only
# the items with an anti-air weapon have dps_air and air_range, and they have both. An item not listed here does no
# damage and wears armour none.
#
# Values are copied from docs/research/red-alert-unit-matchups/items.csv: armor, max_range_cells, the MinRange of
# its ground weapons in the weapons column, dps_none, dps_light, dps_heavy, dps_wood and dps_concrete, and dps_air.
# air_range is the Range of the anti-air weapon in docs/reference/research/redalert/OpenRA/mods/ra/weapons. The
# aircraft, which the reference leaves out, are computed from the same rule files by its method (section 0 of
# docs/research/red-alert-unit-matchups.md); hp is in items.toml.

