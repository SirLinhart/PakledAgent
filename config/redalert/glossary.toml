# What each Red Alert unit and building type is, in plain words, for a model
# that knows the game by name but not its units. The plan choice briefing
# names every type it lists with one line built from its entry here, the cost
# taken from the item table: "Heavy Tank (3tnk), Soviet vehicle, 1,150: the
# Soviet main battle tank ...; strong vs ...; weak vs ...".
#
# One table per type of config/redalert/items.toml, and no other:
#
#   name       the type's name in the game
#   side       "Allies", "Soviets" or "both": who can build it, as the item
#              table's factions say
#   kind       "infantry", "vehicle", "aircraft", "ship", "building" or
#              "defense" (a building that shoots)
#   role       one short sentence: what it is for
#   strong_vs  what it beats
#   weak_vs    what beats it
#
# Written from docs/research/red-alert-unit-matchups.md (its duels, group
# fights and summary for production decisions) and the item table. The file
# is read strictly: a missing or unknown key, a side or kind outside the words
# above, or a text that is empty, longer than one line or too long is an
# error, and tests/redalert/test_glossary.py checks that every type of the
# item table has an entry.

